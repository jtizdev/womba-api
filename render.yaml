services:
  - type: web
    name: womba-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WOMBA_API_KEY
        generateValue: true
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ZEPHYR_API_TOKEN
        sync: false
      - key: ZEPHYR_BASE_URL
        value: https://api.zephyrscale.smartbear.com/v2
      - key: SECRET_KEY
        generateValue: true

