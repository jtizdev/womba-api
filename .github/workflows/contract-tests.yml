name: API Contract Tests

# Run on every PR and push to main
# These tests ensure API contract stability for all clients
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout womba-api
      uses: actions/checkout@v4
      with:
        path: womba-api
    
    - name: Checkout womba (core package)
      uses: actions/checkout@v4
      with:
        repository: jtizdev/womba
        path: womba
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: womba-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ../womba
    
    - name: Run Contract Tests
      working-directory: womba-api
      env:
        WOMBA_API_KEY: test-api-key-12345
        ENV: test
      run: |
        pytest tests/test_api_contract.py -v --tb=short
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: contract-test-results
        path: womba-api/test-results/
  
  
  # Notify dependent repos if contract tests fail
  notify-clients:
    name: Notify Client Repos
    needs: contract-tests
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
    - name: Create issue in womba-go
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.create({
            owner: 'jtizdev',
            repo: 'womba-go',
            title: '⚠️ API Contract Changed - Potential Breaking Change',
            body: 'API contract tests failed in womba-api. Please review and update Go client if needed.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            labels: ['api-contract', 'breaking-change']
          })
    
    - name: Create issue in womba-java
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.create({
            owner: 'jtizdev',
            repo: 'womba-java',
            title: '⚠️ API Contract Changed - Potential Breaking Change',
            body: 'API contract tests failed in womba-api. Please review and update Java client if needed.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            labels: ['api-contract', 'breaking-change']
          })
    
    - name: Create issue in womba-node
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.create({
            owner: 'jtizdev',
            repo: 'womba-node',
            title: '⚠️ API Contract Changed - Potential Breaking Change',
            body: 'API contract tests failed in womba-api. Please review and update Node.js client if needed.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            labels: ['api-contract', 'breaking-change']
          })

